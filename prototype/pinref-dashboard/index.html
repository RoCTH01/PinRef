<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PinRef Dashboard — Throwaway UI Prototype</title>
  <!-- Winning Contact Sheet direction, refined to test constrained floating tools and one inspector model. -->
  <style>
    :root {
      color-scheme: dark;
      --bg:#111315; --panel:#17191c; --panel-2:#1e2125; --panel-3:#282c31;
      --text:#f3f3f1; --muted:#9b9da3; --line:rgba(255,255,255,.1); --soft:rgba(255,255,255,.055);
      --accent:#a9c6ff; --accent-strong:#75a5ff; --danger:#ee8d92;
      --shadow:0 24px 80px rgba(0,0,0,.34); --font:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg:#eeefed; --panel:#fafaf8; --panel-2:#f2f3f0; --panel-3:#e5e7e4;
      --text:#202225; --muted:#6e7278; --line:rgba(20,24,30,.13); --soft:rgba(20,24,30,.055);
      --accent:#345f9d; --accent-strong:#215ea9; --danger:#a53f47; --shadow:0 24px 80px rgba(30,32,35,.16);
    }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:var(--font); }
    body { height:100vh; overflow:hidden; }
    button,input,textarea { font:inherit; color:inherit; }
    button { cursor:pointer; }
    button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible {
      outline:3px solid color-mix(in srgb,var(--accent-strong) 75%,transparent); outline-offset:2px;
    }
    .app { min-height:100vh; }
    .prototype-badge {
      display:none; position:fixed; z-index:90; top:10px; left:50%; transform:translateX(-50%); pointer-events:none;
      padding:6px 10px; border:1px solid rgba(255,181,99,.42); border-radius:999px;
      color:#ffd0a0; background:rgba(48,31,18,.88); backdrop-filter:blur(16px);
      font-size:10px; font-weight:760; letter-spacing:.075em; text-transform:uppercase; white-space:nowrap;
    }
    .icon-button,.quiet-button,.pill,.tag-chip { border:1px solid var(--line); background:var(--soft); color:var(--text); }
    .icon-button { width:40px; height:40px; border-radius:11px; display:grid; place-items:center; flex:0 0 auto; }
    .icon-button:hover,.quiet-button:hover,.pill:hover,.tag-chip:hover,.menu-item:hover,.suggestion-item:hover { background:var(--panel-3); }
    .quiet-button { min-height:40px; border-radius:11px; padding:8px 13px; }
    .quiet-button.primary { background:var(--text); color:var(--bg); border-color:transparent; font-weight:720; }
    .quiet-button.danger,.menu-item.danger { color:var(--danger); }
    .muted { color:var(--muted); }
    .eyebrow { color:var(--muted); font-size:10px; font-weight:780; letter-spacing:.1em; text-transform:uppercase; }
    .divider { height:1px; background:var(--line); }

    .search-box { position:relative; min-width:220px; flex:1; z-index:30; }
    .search-box > span { position:absolute; left:14px; top:21px; transform:translateY(-50%); color:var(--muted); }
    .search-box input { width:100%; height:42px; padding:0 64px 0 40px; border:1px solid var(--line); border-radius:13px; background:var(--soft); outline:0; }
    .search-box input:focus { border-color:color-mix(in srgb,var(--accent) 55%,var(--line)); background:var(--panel-2); }
    .search-box kbd { position:absolute; right:11px; top:9px; padding:4px 7px; color:var(--muted); background:var(--panel-3); border-radius:7px; font-size:11px; }
    .search-suggestions { position:absolute; top:49px; left:0; right:0; max-height:286px; overflow-y:auto; padding:9px; border:1px solid var(--line); border-radius:14px; background:color-mix(in srgb,var(--panel) 97%,transparent); box-shadow:var(--shadow); backdrop-filter:blur(22px); }
    .suggestion-heading { display:flex; justify-content:space-between; padding:5px 7px 8px; color:var(--muted); font-size:11px; }
    .suggestion-item,.menu-item,.tag-option { width:100%; border:0; border-radius:9px; background:transparent; text-align:left; }
    .suggestion-item { display:grid; grid-template-columns:10px 1fr auto; align-items:center; gap:9px; padding:9px 8px; }
    .suggestion-item i,.tag-option i { width:8px; height:8px; border-radius:50%; background:var(--item-color); }
    .suggestion-item small { color:var(--muted); }

    .art { position:relative; overflow:hidden; isolation:isolate; background:var(--art-bg); }
    .art::before { content:""; position:absolute; inset:0; opacity:.75; mix-blend-mode:screen; background:radial-gradient(circle at 66% 22%,rgba(255,255,255,.32),transparent 10%),linear-gradient(135deg,transparent 42%,rgba(255,255,255,.08) 43% 47%,transparent 48%),radial-gradient(ellipse at 50% 76%,rgba(0,0,0,.5),transparent 47%); }
    .art::after { content:""; position:absolute; width:36%; height:62%; left:32%; bottom:-6%; background:linear-gradient(145deg,rgba(255,255,255,.36),rgba(7,8,10,.76)); border-radius:48% 48% 18% 18%/28% 28% 14% 14%; box-shadow:0 -52px 0 -22px rgba(5,5,7,.82),42px 28px 60px rgba(0,0,0,.34); transform:rotate(var(--pose,0deg)); filter:saturate(.75); }
    .art-a{--art-bg:linear-gradient(150deg,#586776 0%,#252d36 42%,#101114 100%);--pose:-5deg}.art-b{--art-bg:linear-gradient(135deg,#382b43 0%,#953f62 52%,#101218 100%);--pose:8deg}.art-c{--art-bg:linear-gradient(145deg,#d3b9a5 0%,#a77f5f 43%,#343233 100%);--pose:-12deg}.art-d{--art-bg:linear-gradient(135deg,#42a4ad 0%,#f4cb5d 48%,#f5616c 73%,#334758 100%);--pose:12deg}.art-e{--art-bg:linear-gradient(145deg,#d3d0ca 0%,#7e8388 45%,#2b2d31 46%,#d8d4cd 100%);--pose:0deg}.art-f{--art-bg:linear-gradient(155deg,#132733 0%,#1f7582 34%,#cf554b 64%,#11131b 100%);--pose:-4deg}.art-g{--art-bg:linear-gradient(135deg,#d7d4d2 0%,#4e4d50 50%,#121317 100%);--pose:15deg}.art-h{--art-bg:linear-gradient(150deg,#b1c3d7 0%,#948cb0 48%,#322b4e 100%);--pose:-14deg}.art-i{--art-bg:linear-gradient(135deg,#04070c 0%,#20252c 44%,#831b27 100%);--pose:5deg}.art-j{--art-bg:linear-gradient(155deg,#bea98b 0%,#66735d 42%,#22282a 100%);--pose:-8deg}.art-k{--art-bg:linear-gradient(135deg,#b7d4e0 0%,#9baea8 43%,#243a44 100%);--pose:9deg}.art-l{--art-bg:linear-gradient(135deg,#5d2226 0%,#cc303c 50%,#131013 100%);--pose:-3deg}
    .tag-row { display:flex; gap:5px; overflow:hidden; }
    .tag { display:inline-flex; align-items:center; min-width:0; padding:4px 8px; border-radius:999px; background:color-mix(in srgb,var(--tag-color,#8f91a0) 30%,var(--panel-3)); border:1px solid color-mix(in srgb,var(--tag-color,#8f91a0) 30%,transparent); font-size:11px; line-height:1; white-space:nowrap; }
    .ref-card { position:relative; min-width:0; break-inside:avoid; margin-bottom:12px; }
    .ref-card .card-art { width:100%; aspect-ratio:var(--ratio,4/5); border-radius:12px; border:1px solid var(--line); transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease; }
    .ref-card:hover .card-art { border-color:color-mix(in srgb,var(--text) 30%,transparent); transform:translateY(-2px); box-shadow:0 12px 30px rgba(0,0,0,.14); }
    .ref-card.selected .card-art { border-color:var(--accent-strong); box-shadow:0 0 0 2px color-mix(in srgb,var(--accent-strong) 70%,transparent); }
    .select-box { position:absolute; z-index:2; top:9px; left:9px; width:24px; height:24px; border-radius:6px; border:1px solid rgba(255,255,255,.65); background:rgba(13,15,18,.45); display:grid; place-items:center; opacity:0; transition:opacity .15s; }
    .ref-card:hover .select-box,.ref-card.selected .select-box { opacity:1; }
    .ref-card.selected .select-box { background:var(--accent); border-color:var(--accent); color:#0c1727; }
    .ref-card.selected .select-box::after { content:"✓"; font-size:13px; font-weight:900; }

    .workspace { --sidebar-width:248px; --dock-width:0px; display:grid; grid-template-columns:var(--sidebar-width) minmax(0,1fr); height:100vh; background:var(--bg); transition:grid-template-columns .24s cubic-bezier(.2,.8,.2,1); }
    .workspace.sidebar-closed { --sidebar-width:0px; }
    .workspace.inspector-docked-layout { --dock-width:376px; }
    .library-sidebar { position:relative; z-index:50; min-width:0; height:100vh; display:flex; flex-direction:column; overflow:hidden; padding:18px 12px 12px; border-right:1px solid var(--line); background:linear-gradient(180deg,color-mix(in srgb,var(--panel) 96%,var(--bg)),color-mix(in srgb,var(--panel) 88%,var(--bg))); box-shadow:inset -1px 0 rgba(255,255,255,.025); opacity:1; visibility:visible; transform:translateX(0); transition:opacity .18s ease,visibility .18s ease,transform .24s cubic-bezier(.2,.8,.2,1); }
    .workspace.sidebar-closed .library-sidebar { overflow:hidden; opacity:0; visibility:hidden; transform:translateX(-18px); }
    .library-sidebar nav { min-height:0; display:flex; flex:1; flex-direction:column; }
    .sidebar-brand { height:34px; display:flex; align-items:center; margin:-4px 0 14px; padding:0 8px 0 42px; }
    .sidebar-brand-copy { min-width:0; display:flex; align-items:center; }
    .sidebar-brand-copy strong { font-size:14px; line-height:1; letter-spacing:-.015em; }
    .sidebar-section { margin-top:12px; }
    .sidebar-section.tags-section { min-height:0; display:flex; flex:1; flex-direction:column; }
    .sidebar-heading { min-height:39px; display:flex; align-items:center; justify-content:space-between; padding:7px 9px 6px; color:var(--muted); font-size:10px; font-weight:780; letter-spacing:.085em; text-transform:uppercase; }
    .sidebar-heading button { width:24px; height:24px; border:0; border-radius:7px; background:transparent; color:var(--muted); }
    .sidebar-heading button:hover { background:var(--panel-3); color:var(--text); }
    .sidebar-heading-title { display:flex; align-items:center; gap:7px; animation:control-swap .12s ease-out; }
    .sidebar-heading-count { min-width:21px; padding:2px 6px; border-radius:999px; background:var(--soft); color:var(--muted); font-size:9px; font-style:normal; font-variant-numeric:tabular-nums; letter-spacing:0; text-align:center; }
    .sidebar-selection-head { width:100%; display:flex; align-items:center; gap:4px; color:var(--text); letter-spacing:0; text-transform:none; animation:control-swap .12s ease-out; }
    .sidebar-selection-head strong { min-width:0; flex:1; font-size:10px; }
    .sidebar-selection-head button { width:auto; min-width:24px; padding:0 6px; font-size:10px; }
    .sidebar-selection-head .danger { color:var(--danger); }
    @keyframes control-swap { from{opacity:.45;transform:scale(.985)} to{opacity:1;transform:scale(1)} }
    .sidebar-item { width:100%; min-height:38px; display:grid; grid-template-columns:20px minmax(0,1fr) auto; align-items:center; gap:8px; padding:7px 10px; border:1px solid transparent; border-radius:10px; background:transparent; color:var(--muted); text-align:left; transition:background .14s ease,color .14s ease,border-color .14s ease,transform .14s ease; }
    .sidebar-item:hover { background:var(--soft); color:var(--text); }
    .sidebar-item:active { transform:scale(.985); }
    .sidebar-item.active { border-color:color-mix(in srgb,var(--accent) 20%,transparent); background:color-mix(in srgb,var(--accent) 15%,var(--soft)); color:var(--text); }
    .sidebar-item > span:nth-child(2) { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; }
    .sidebar-item em { color:var(--muted); font-size:10px; font-style:normal; font-variant-numeric:tabular-nums; }
    .sidebar-icon { width:20px; height:20px; display:grid; place-items:center; border-radius:6px; color:currentColor; font-size:12px; }
    .sidebar-item.active .sidebar-icon { background:color-mix(in srgb,var(--accent) 19%,transparent); color:var(--accent); }
    .tag-dot { width:8px; height:8px; margin-left:3px; border-radius:50%; background:var(--tag-color,#8f91a0); }
    .sidebar-more { display:block; padding:7px 12px; color:var(--muted); font-size:11px; }
    .sidebar-backdrop { display:none; }
    .sidebar-tag-search { position:relative; margin:0 4px 7px; }
    .sidebar-tag-search span { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:12px; }
    .sidebar-tag-search input { width:100%; height:34px; padding:0 10px 0 29px; border:1px solid var(--line); border-radius:9px; background:var(--soft); outline:0; font-size:11px; }
    .sidebar-tag-search input:focus { border-color:color-mix(in srgb,var(--accent) 55%,var(--line)); background:var(--panel-2); }
    .sidebar-tag-list { min-height:88px; overflow-y:auto; padding:0 2px 6px 0; overscroll-behavior:contain; scrollbar-width:thin; }
    .sidebar-tag-item { display:grid; grid-template-columns:15px 18px minmax(0,1fr) auto 25px; align-items:center; gap:3px; min-height:34px; padding:2px 2px 2px 4px; border-radius:9px; color:var(--muted); }
    .sidebar-tag-item:hover,.sidebar-tag-item.checked { background:var(--soft); color:var(--text); }
    .sidebar-tag-item.drag-over { box-shadow:inset 0 2px 0 var(--accent-strong); }
    .tag-drag-handle,.tag-more { width:100%; height:26px; display:grid; place-items:center; padding:0; border:0; border-radius:7px; background:transparent; color:var(--muted); opacity:0; }
    .tag-drag-handle { cursor:grab; font-size:11px; }
    .tag-drag-handle:active { cursor:grabbing; }
    .tag-more { font-size:12px; }
    .sidebar-tag-item:hover .tag-drag-handle,.sidebar-tag-item:hover .tag-more,.sidebar-tag-item.checked .tag-more { opacity:1; }
    .tag-more:hover,.tag-drag-handle:hover { background:var(--panel-3); color:var(--text); }
    .tag-check { display:grid; place-items:center; }
    .tag-check input { appearance:none; width:15px; height:15px; margin:0; border:1px solid color-mix(in srgb,var(--muted) 60%,transparent); border-radius:4px; background:transparent; opacity:0; }
    .sidebar-tag-item:hover .tag-check input,.tag-check input:checked,.tag-check input:focus-visible { opacity:1; }
    .tag-check input:checked { border-color:var(--accent-strong); background:var(--accent-strong); }
    .tag-check input:checked::after { content:"✓"; display:block; color:#091425; font-size:10px; font-weight:900; line-height:13px; text-align:center; }
    .sidebar-tag-filter { min-width:0; display:flex; align-items:center; gap:7px; padding:6px 2px; border:0; background:transparent; color:inherit; text-align:left; }
    .sidebar-tag-filter span:last-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:11px; }
    .sidebar-tag-item.active .sidebar-tag-filter { color:var(--text); font-weight:680; }
    .sidebar-tag-count { color:var(--muted); font-size:9px; font-style:normal; font-variant-numeric:tabular-nums; }
    .sidebar-manage-card { margin:7px 4px; padding:9px; border:1px solid var(--line); border-radius:11px; background:var(--panel-2); box-shadow:0 12px 34px rgba(0,0,0,.18); }
    .sidebar-manage-card header { display:flex; align-items:center; gap:7px; margin-bottom:8px; }
    .sidebar-manage-card header strong { min-width:0; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:11px; }
    .sidebar-manage-card header button { width:24px; height:24px; border:0; border-radius:6px; background:transparent; color:var(--muted); }
    .tag-manage-actions { display:grid; gap:3px; }
    .tag-manage-actions button { min-height:31px; display:flex; align-items:center; gap:8px; padding:5px 7px; border:0; border-radius:7px; background:transparent; text-align:left; font-size:11px; }
    .tag-manage-actions button:hover { background:var(--panel-3); }
    .tag-manage-actions .danger { color:var(--danger); }
    .tag-editor-input { width:100%; height:34px; padding:0 9px; border:1px solid var(--line); border-radius:8px; background:var(--soft); font-size:11px; }
    .tag-editor-copy { margin:0 0 9px; color:var(--muted); font-size:10px; line-height:1.45; }
    .tag-editor-footer { display:flex; justify-content:flex-end; gap:6px; margin-top:9px; }
    .tag-editor-footer button { min-height:30px; padding:5px 9px; border:1px solid var(--line); border-radius:8px; background:var(--soft); font-size:10px; }
    .tag-editor-footer .danger { color:#fff; border-color:transparent; background:var(--danger); }
    .color-swatches { display:flex; flex-wrap:wrap; gap:7px; }
    .color-swatch { width:25px; height:25px; border:2px solid transparent; border-radius:50%; background:var(--swatch); box-shadow:inset 0 0 0 1px rgba(255,255,255,.25); }
    .color-swatch.active { border-color:var(--text); box-shadow:0 0 0 2px var(--panel-2),0 0 0 4px var(--accent-strong); }
    .sidebar-footer { display:grid; gap:2px; margin-top:8px; padding-top:8px; border-top:1px solid var(--line); }
    .sidebar-footer-button { width:100%; min-height:38px; display:flex; align-items:center; gap:8px; padding:5px 8px; border:0; border-radius:8px; background:transparent; color:var(--muted); text-align:left; transition:background .14s ease,color .14s ease; }
    .sidebar-footer-button:hover { background:var(--soft); color:var(--text); }
    .sidebar-footer-button > span:first-child { width:24px; height:24px; display:grid; place-items:center; flex:0 0 auto; color:var(--muted); }
    .sidebar-footer-button.donation > span:first-child { color:#c99348; }
    .sidebar-footer-button strong { display:block; font-size:10px; }
    .sidebar-footer-button small { display:block; margin-top:1px; color:var(--muted); font-size:9px; }

    .contact { min-width:0; height:100vh; overflow-y:auto; padding:0 30px 120px; background:var(--bg); transition:padding-right .2s ease; }
    .contact.inspector-docked { padding-right:392px; }
    .anchored-topbar { position:fixed; z-index:75; inset:0; height:0; pointer-events:none; }
    .anchored-topbar > * { pointer-events:auto; }
    .contact-header { position:sticky; z-index:40; top:0; margin:0 auto 14px; max-width:1440px; padding:14px 0 9px; border-bottom:1px solid var(--line); background:color-mix(in srgb,var(--bg) 84%,transparent); backdrop-filter:blur(24px) saturate(1.18); }
    .topbar-primary { min-height:42px; }
    .anchored-topbar .search-box { position:fixed; z-index:75; top:14px; left:calc(var(--sidebar-width) + (100vw - var(--sidebar-width) - var(--dock-width))/2); width:min(680px,calc(100vw - var(--sidebar-width) - var(--dock-width) - 112px)); transform:translateX(-50%); transition:left .24s cubic-bezier(.2,.8,.2,1),width .24s cubic-bezier(.2,.8,.2,1); }
    .sidebar-toggle { position:fixed; z-index:90; top:14px; left:12px; width:34px; height:34px; border:1px solid transparent; border-radius:9px; color:var(--muted); background:transparent; box-shadow:none; transition:background .14s ease,color .14s ease,border-color .14s ease; }
    .sidebar-toggle:hover,.sidebar-toggle:focus-visible { color:var(--text); background:var(--soft); }
    .workspace:not(.sidebar-closed) .sidebar-toggle { color:var(--accent-strong); border-color:color-mix(in srgb,var(--accent-strong) 46%,transparent); background:color-mix(in srgb,var(--accent) 13%,transparent); }
    .sidebar-toggle-icon { width:17px; height:17px; fill:none; stroke:currentColor; stroke-linecap:round; stroke-linejoin:round; stroke-width:1.5; }
    .control-tooltip { position:absolute; top:calc(100% + 7px); left:0; width:max-content; max-width:180px; padding:6px 8px; border:1px solid var(--line); border-radius:7px; background:var(--panel); box-shadow:0 10px 24px rgba(0,0,0,.22); color:var(--text); font-size:10px; font-weight:600; opacity:0; pointer-events:none; transform:translateY(-3px); transition:opacity .12s ease,transform .12s ease; }
    .sidebar-toggle:hover .control-tooltip,.sidebar-toggle:focus-visible .control-tooltip { opacity:1; transform:translateY(0); }
    .gallery-toolbar { min-height:45px; display:flex; align-items:center; gap:12px; padding-top:8px; color:var(--muted); }
    .gallery-context { min-width:0; display:flex; align-items:center; gap:9px; font-size:11px; }
    .gallery-context strong { color:var(--text); font-size:12px; white-space:nowrap; }
    .gallery-controls { margin-left:auto; display:flex; align-items:center; gap:8px; }
    .compact-sort { min-height:32px; display:inline-flex; align-items:center; gap:6px; padding:5px 9px; border:1px solid transparent; border-radius:9px; background:transparent; color:var(--muted); font-size:10px; white-space:nowrap; }
    .compact-sort:hover { background:var(--soft); color:var(--text); }
    .active-filter { max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:5px 8px; border-radius:999px; background:var(--soft); color:var(--muted); font-size:10px; }
    .layout-switcher { display:flex; align-items:center; gap:2px; padding:3px; border:1px solid var(--line); border-radius:11px; background:var(--soft); }
    .layout-option { min-height:30px; display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:5px 8px; border:0; border-radius:8px; background:transparent; color:var(--muted); font-size:10px; white-space:nowrap; transition:background .14s ease,color .14s ease,box-shadow .14s ease; }
    .layout-option:hover { color:var(--text); background:color-mix(in srgb,var(--panel-3) 72%,transparent); }
    .layout-option.active { color:var(--text); background:var(--panel-2); box-shadow:0 1px 1px rgba(0,0,0,.14),inset 0 0 0 1px color-mix(in srgb,var(--text) 8%,transparent); }
    .layout-option svg { width:14px; height:14px; flex:0 0 auto; fill:none; stroke:currentColor; stroke-width:1.5; }
    .contact-sheet { max-width:1440px; margin:0 auto; animation:gallery-enter .18s ease-out; }
    .contact-sheet.mode-waterfall { columns:6 175px; column-gap:12px; }
    .contact-sheet.mode-masonry { display:grid; grid-template-columns:repeat(auto-fill,minmax(168px,1fr)); grid-auto-flow:row dense; grid-auto-rows:6px; gap:12px; }
    .contact-sheet.mode-masonry .ref-card { grid-row:span var(--masonry-span,13); height:100%; margin-bottom:0; overflow:hidden; border-radius:12px; }
    .contact-sheet.mode-masonry .card-art { height:100%; aspect-ratio:auto; }

      document.querySelector("[data-sidebar-toggle]")?.addEventListener("click",()=>{state.sidebarOpen=!state.sidebarOpen;render();requestAnimationFrame(()=>document.querySelector("[data-sidebar-toggle]")?.focus());});
      document.querySelector("[data-sidebar-backdrop]")?.addEventListener("click",()=>{state.sidebarOpen=false;render();requestAnimationFrame(()=>document.querySelector("[data-sidebar-toggle]")?.focus());});
      document.querySelectorAll("[data-sidebar-filter]").forEach(el=>el.addEventListener("click",()=>{state.destination="Library";state.filter=el.dataset.sidebarFilter;state.searchOpen=false;if(compact())state.sidebarOpen=false;render();}));
      document.querySelectorAll("[data-destination]").forEach(el=>el.addEventListener("click",()=>{state.destination=el.dataset.destination;if(compact())state.sidebarOpen=false;render();}));
      document.querySelectorAll("[data-dismiss-attempt]").forEach(el=>el.addEventListener("click",()=>{const index=captureAttempts.findIndex(item=>item.attemptId===el.dataset.dismissAttempt);if(index>=0)captureAttempts.splice(index,1);render();}));
      document.querySelectorAll("[data-check-attempt]").forEach(el=>el.addEventListener("click",()=>{const item=captureAttempts.find(entry=>entry.attemptId===el.dataset.checkAttempt);if(item){item.evidence="check-again: no reliable evidence";item.confidence="Unavailable";}render();}));
      document.querySelectorAll("[data-retry-attempt]").forEach(el=>el.addEventListener("click",()=>{const index=captureAttempts.findIndex(item=>item.attemptId===el.dataset.retryAttempt);if(index<0)return;const [item]=captureAttempts.splice(index,1);records.unshift({id:item.pinId,art:"art-a",ratio:"4/5",title:`Recovered Pin ${item.pinId}`,tags:[],note:"",saved:new Date().toLocaleDateString()});state.destination="Library";state.filter="All";render();}));
      const sidebarSearch=document.querySelector("#sidebar-tag-search");sidebarSearch?.addEventListener("input",event=>{state.sidebarTagQuery=event.target.value;const cursor=event.target.selectionStart;render();const input=document.querySelector("#sidebar-tag-search");input?.focus();input?.setSelectionRange(cursor,cursor);});
      document.querySelectorAll("[data-sidebar-tag-check]").forEach(el=>el.addEventListener("click",event=>{event.preventDefault();event.stopPropagation();const visible=filteredSidebarTags(),index=visible.findIndex(item=>item.tag===el.dataset.sidebarTagCheck),selecting=!state.selectedSidebarTags.has(el.dataset.sidebarTagCheck);if(event.shiftKey&&state.lastSidebarTagIndex!==null){const start=Math.min(state.lastSidebarTagIndex,index),end=Math.max(state.lastSidebarTagIndex,index);visible.slice(start,end+1).forEach(item=>selecting?state.selectedSidebarTags.add(item.tag):state.selectedSidebarTags.delete(item.tag));}else selecting?state.selectedSidebarTags.add(el.dataset.sidebarTagCheck):state.selectedSidebarTags.delete(el.dataset.sidebarTagCheck);state.lastSidebarTagIndex=index;state.sidebarTagMenu=null;state.sidebarTagEditor=null;render();}));
      document.querySelectorAll("[data-sidebar-tag-menu]").forEach(el=>el.addEventListener("click",event=>{event.stopPropagation();state.sidebarTagMenu=state.sidebarTagMenu===el.dataset.sidebarTagMenu?null:el.dataset.sidebarTagMenu;state.sidebarTagEditor=null;render();}));
      document.querySelectorAll("[data-edit-sidebar-tag]").forEach(el=>el.addEventListener("click",()=>{state.sidebarTagEditor={mode:el.dataset.editSidebarTag,tags:[state.sidebarTagMenu]};render();requestAnimationFrame(()=>document.querySelector("#tag-rename-input")?.select());}));
      document.querySelectorAll("[data-close-tag-manager]").forEach(el=>el.addEventListener("click",()=>{state.sidebarTagEditor=null;state.sidebarTagMenu=null;render();}));
      document.querySelector("[data-save-tag-name]")?.addEventListener("click",()=>renameSidebarTag(state.sidebarTagEditor.tags[0],document.querySelector("#tag-rename-input").value));
      document.querySelector("#tag-rename-input")?.addEventListener("keydown",event=>{if(event.key==="Enter")renameSidebarTag(state.sidebarTagEditor.tags[0],event.target.value);});
      document.querySelectorAll("[data-set-tag-color]").forEach(el=>el.addEventListener("click",()=>{tagColors[state.sidebarTagEditor.tags[0]]=el.dataset.setTagColor;state.sidebarTagEditor=null;state.sidebarTagMenu=null;render();}));
      document.querySelector("[data-bulk-remove-tags]")?.addEventListener("click",()=>{state.sidebarTagEditor={mode:"delete",tags:[...state.selectedSidebarTags]};state.sidebarTagMenu=null;render();});
      document.querySelector("[data-clear-sidebar-selection]")?.addEventListener("click",()=>{state.selectedSidebarTags.clear();state.lastSidebarTagIndex=null;render();});
      document.querySelector("[data-remove-sidebar-tags]")?.addEventListener("click",()=>removeSidebarTags(state.sidebarTagEditor.tags));
      document.querySelectorAll("[data-sidebar-tag-row]").forEach(el=>{el.addEventListener("dragstart",event=>{event.dataTransfer.effectAllowed="move";event.dataTransfer.setData("text/plain",el.dataset.sidebarTagRow);});el.addEventListener("dragover",event=>{event.preventDefault();el.classList.add("drag-over");});el.addEventListener("dragleave",()=>el.classList.remove("drag-over"));el.addEventListener("drop",event=>{event.preventDefault();const source=event.dataTransfer.getData("text/plain"),target=el.dataset.sidebarTagRow;el.classList.remove("drag-over");if(!source||source===target)return;const from=tagCatalog.findIndex(item=>item.tag===source),to=tagCatalog.findIndex(item=>item.tag===target);if(from<0||to<0)return;const [moved]=tagCatalog.splice(from,1);tagCatalog.splice(to,0,moved);render();});});
      document.querySelector("[data-sort-recent]")?.addEventListener("click",()=>{state.sortRecent=!state.sortRecent;render();});
      document.querySelectorAll("[data-gallery-mode]").forEach(el=>el.addEventListener("click",()=>{state.galleryMode=el.dataset.galleryMode;render();requestAnimationFrame(()=>document.querySelector(`[data-gallery-mode="${state.galleryMode}"]`)?.focus());}));
      document.querySelectorAll("[data-id]").forEach(el=>el.addEventListener("click",event=>{if(event.target.closest("[data-select]"))return;state.activeId=el.dataset.id;state.activeNoteId=el.dataset.id;state.selected=new Set([el.dataset.id]);if(state.inspectorMode==="closed")state.inspectorMode="floating";state.tagPickerOpen=false;render();}));
      document.querySelectorAll("[data-select]").forEach(el=>el.addEventListener("click",event=>{event.stopPropagation();const id=el.dataset.select;state.selected.has(id)?state.selected.delete(id):state.selected.add(id);state.activeId=id;state.activeNoteId=id;state.lastAction="";if(state.selected.size&&state.inspectorMode==="closed")state.inspectorMode="floating";else if(!state.selected.size&&state.inspectorMode!=="docked")state.inspectorMode="closed";state.tagPickerOpen=false;state.tagPickerPosition=null;render();}));
      const search=document.querySelector("#search");search?.addEventListener("focus",()=>{if(!state.searchOpen){state.searchOpen=true;render();requestAnimationFrame(()=>document.querySelector("#search")?.focus());}});search?.addEventListener("input",event=>{state.query=event.target.value;state.searchOpen=true;const cursor=event.target.selectionStart;render();const input=document.querySelector("#search");input?.focus();input?.setSelectionRange(cursor,cursor);});
      document.querySelectorAll("[data-search-tag]").forEach(el=>el.addEventListener("click",()=>{state.query=el.dataset.searchTag;state.searchOpen=false;render();}));
      document.querySelector("#theme")?.addEventListener("click",()=>{state.theme=state.theme==="light"?"dark":"light";applyTheme();render();requestAnimationFrame(()=>document.querySelector("#theme")?.focus());});
      document.querySelector("[data-toggle-tag-picker]")?.addEventListener("click",()=>{state.tagPickerOpen=!state.tagPickerOpen;state.tagPickerPosition=null;state.lastAction="";render();requestAnimationFrame(()=>document.querySelector("#tag-picker-search")?.focus());});
      document.querySelectorAll("[data-close-tag-picker]").forEach(el=>el.addEventListener("click",()=>{state.tagPickerOpen=false;state.tagQuery="";state.tagPickerPosition=null;render();requestAnimationFrame(()=>document.querySelector("[data-toggle-tag-picker]")?.focus());}));
      const tagSearch=document.querySelector("#tag-picker-search");tagSearch?.addEventListener("input",event=>{state.tagQuery=event.target.value;const cursor=event.target.selectionStart;render();const input=document.querySelector("#tag-picker-search");input?.focus();input?.setSelectionRange(cursor,cursor);});tagSearch?.addEventListener("keydown",event=>{if(event.key==="ArrowDown"){event.preventDefault();document.querySelector("[data-apply-tag],[data-create-tag]")?.focus();}if(event.key==="Escape"){event.preventDefault();state.tagPickerOpen=false;render();requestAnimationFrame(()=>document.querySelector("[data-toggle-tag-picker]")?.focus());}});
      document.querySelectorAll("[data-apply-tag]").forEach(el=>el.addEventListener("click",()=>applyTag(el.dataset.applyTag)));document.querySelectorAll("[data-create-tag]").forEach(el=>el.addEventListener("click",()=>applyTag(el.dataset.createTag)));
      document.querySelectorAll("[data-remove-common-tag]").forEach(el=>el.addEventListener("click",()=>removeCommonTag(el.dataset.removeCommonTag)));
      document.querySelectorAll("[data-note-id]").forEach(el=>{const preview=()=>{const note=records.find(item=>item.id===el.dataset.noteId),editor=document.querySelector("[data-note-editor]");if(!note||!editor)return;document.querySelector("[data-note-full-title]").textContent=note.title;editor.value=note.note;editor.dataset.noteEditor=note.id;editor.name=`note-${note.id}`;editor.setAttribute("aria-label",`Edit note for ${note.title}`);};el.addEventListener("mouseenter",preview);el.addEventListener("focus",preview);el.addEventListener("click",()=>{state.activeNoteId=el.dataset.noteId;render();});});
      document.querySelectorAll("[data-note-editor]").forEach(editor=>editor.addEventListener("input",event=>{const note=records.find(item=>item.id===event.target.dataset.noteEditor);if(!note)return;note.note=event.target.value;const preview=document.querySelector(`[data-note-id="${note.id}"] span`);if(preview)preview.textContent=note.note||"No note yet";}));
      document.querySelector("[data-clear-selection]")?.addEventListener("click",()=>{state.selected.clear();state.lastAction="";if(state.inspectorMode!=="docked")state.inspectorMode="closed";state.tagPickerOpen=false;state.tagPickerPosition=null;render();});
      document.querySelector("[data-toggle-dock]")?.addEventListener("click",()=>{state.inspectorMode=state.inspectorMode==="docked"?(state.selected.size?"floating":"closed"):"docked";state.inspectorPosition=null;render();});
      document.querySelector("[data-close-inspector]")?.addEventListener("click",()=>{state.inspectorMode="closed";render();});
      bindInspectorDrag();
      positionTagPicker();
      bindTagPickerDrag();
    }
    applyTheme();render();
    compactMedia.addEventListener("change",event=>{state.sidebarOpen=!event.matches;render();});
    document.addEventListener("pointerdown",event=>{if(state.searchOpen&&!event.target.closest(".search-box")){setTimeout(()=>{if(state.searchOpen){state.searchOpen=false;render();}},0);}},true);
    document.addEventListener("keydown",event=>{const editing=event.target.matches("input,textarea,[contenteditable=true]");if(!editing&&(event.key==="/"||((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==="k"))){event.preventDefault();document.querySelector("#search")?.focus();}if(event.key==="Escape"){if(state.sidebarTagEditor||state.sidebarTagMenu){state.sidebarTagEditor=null;state.sidebarTagMenu=null;}else if(state.tagPickerOpen){state.tagPickerOpen=false;state.tagQuery="";state.tagPickerPosition=null;}else if(state.searchOpen)state.searchOpen=false;else if(!editing&&state.selected.size){state.selected.clear();if(state.inspectorMode!=="docked")state.inspectorMode="closed";}render();}});
  </script>
</body>
</html>
